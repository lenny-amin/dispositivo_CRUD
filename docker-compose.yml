version: '3.8'
services:
  postgres:
    image: postgres:14
    container_name: microservicio_postgres
    environment:
      POSTGRES_DB: dispositivos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: